<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colégio JS — Link da Bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C11F2E;
    --red-dark:#7E141F;
    --gold:#E3A23B;
    --gold-light:#FBD98A;
    --green:#1F6B3A;
    --cream:#F6EFE1;
    --paper:#FFFCF6;
    --ink:#271C13;
    --ink-soft:#5B4E3F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(227,162,59,.35), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(193,31,46,.30), transparent 50%),
      linear-gradient(160deg, #2B1B10 0%, #1B120B 60%, #120C07 100%);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:420px;
    background:var(--cream);
    border-radius:28px;
    padding:44px 32px 36px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.55);
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';
    position:absolute; top:0; left:0; right:0; height:6px;
    background:linear-gradient(90deg, var(--red), var(--gold), var(--green));
  }
  .logo-wrap{
    width:118px; height:118px;
    margin:6px auto 18px;
    border-radius:50%;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 28px -10px rgba(39,28,19,.35), 0 0 0 6px rgba(227,162,59,.18);
  }
  .logo-wrap img{width:82px; height:82px; object-fit:contain;}
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 4px;
    color:var(--red);
    letter-spacing:.01em;
  }
  .tagline{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:30px;
  }
  .links{display:flex; flex-direction:column; gap:14px;}
  .link-btn{
    display:flex; align-items:center; gap:14px;
    background:var(--red);
    color:#fff;
    text-decoration:none;
    padding:16px 20px;
    border-radius:14px;
    font-weight:600;
    font-size:16px;
    text-align:left;
    box-shadow:0 10px 22px -10px rgba(193,31,46,.6);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
    border:1px solid rgba(0,0,0,.05);
  }
  .link-btn:hover{transform:translateY(-2px); box-shadow:0 14px 28px -10px rgba(193,31,46,.7);}
  .link-btn .ic{
    flex:none;
    width:40px; height:40px;
    border-radius:50%;
    background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center;
  }
  .link-btn .txt{display:flex; flex-direction:column; gap:1px;}
  .link-btn .txt small{
    font-family:'Work Sans', sans-serif;
    font-weight:400;
    font-size:12px;
    opacity:.85;
  }
  .link-btn.whatsapp{background:#1F6B3A; box-shadow:0 10px 22px -10px rgba(31,107,58,.6);}
  .link-btn.whatsapp:hover{box-shadow:0 14px 28px -10px rgba(31,107,58,.7);}
  .link-btn.gold{background:var(--gold); color:var(--red-dark); box-shadow:0 10px 22px -10px rgba(227,162,59,.6);}
  .link-btn.gold:hover{box-shadow:0 14px 28px -10px rgba(227,162,59,.7);}
  .link-btn.gold .ic{background:rgba(126,20,31,.12);}
  .link-btn.red{background:var(--red); box-shadow:0 10px 22px -10px rgba(193,31,46,.6);}
  .link-btn.red:hover{box-shadow:0 14px 28px -10px rgba(193,31,46,.7);}

  footer{
    margin-top:30px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    opacity:.7;
  }

  @media (max-width:420px){
    .card{padding:36px 22px 28px; border-radius:22px;}
    h1{font-size:23px;}
    .link-btn{padding:14px 16px; font-size:15px;}
  }

  @media (min-width:900px){
    .card{max-width:440px; padding:52px 40px 42px;}
    .logo-wrap{width:132px; height:132px;}
    .logo-wrap img{width:92px; height:92px;}
    h1{font-size:29px;}
  }
</style>
</head>
